<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <style>
    .ascii-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      font-size: 11px;
      line-height: 14px;
      fill: #818cf8; /* Sleek indigo text */
      font-weight: bold;
    }
    .glow-cyan {
      fill: #22d3ee;
    }
    .glow-purple {
      fill: #c084fc;
    }
  </style>
  
  <rect width="100%" height="100%" fill="#0b0f19" rx="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  
  <!-- Frame 1: Web Development (Laptop/Code) -->
  <g>
    <animate attributeName="visibility" values="visible;hidden;hidden;visible" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.66;1" />
    <text x="35" y="45" class="ascii-text">
      <tspan x="35" dy="0">  // DEVELOPER TOOLKIT  //  [Frame 1/3]</tspan>
      <tspan x="35" dy="18">  💻   _________________________________________________</tspan>
      <tspan x="35" dy="14">      /                                                 \</tspan>
      <tspan x="35" dy="14">     |  <tspan class="glow-cyan">&lt;coding_the_future&gt;</tspan>                              |</tspan>
      <tspan x="35" dy="14">     |                                                 |</tspan>
      <tspan x="35" dy="14">     |  const developer = {                            |</tspan>
      <tspan x="35" dy="14">     |    name: 'Martin Šrámek',                       |</tspan>
      <tspan x="35" dy="14">     |    roles: ['WebDev', 'Creator', 'OSVČ'],        |</tspan>
      <tspan x="35" dy="14">     |    focus: ['Clean Code', 'Modern Aesthetics']   |</tspan>
      <tspan x="35" dy="14">     |  };                                             |</tspan>
      <tspan x="35" dy="14">     |  developer.buildNextAwesomeWebSite();           |</tspan>
      <tspan x="35" dy="14">      \_________________________________________________/</tspan>
      <tspan x="35" dy="14">            \_____________________________________/</tspan>
      <tspan x="35" dy="14">         _______________________________________________</tspan>
      <tspan x="35" dy="14">      /_________________________________________________\</tspan>
    </text>
  </g>

  <!-- Frame 2: Video Editing (Timeline/Camera) -->
  <g>
    <animate attributeName="visibility" values="hidden;visible;hidden;hidden" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.66;1" />
    <text x="35" y="45" class="ascii-text">
      <tspan x="35" dy="0">  // VIDEO &amp; FILM PRODUCTION  //  [Frame 2/3]</tspan>
      <tspan x="35" dy="18">  🎥   .-----------------------------------------------.</tspan>
      <tspan x="35" dy="14">      /  [REC] 🔴   TIMELINE EDITING   01:42:07:18      \</tspan>
      <tspan x="35" dy="14">     |  .---------------------------------------------.  |</tspan>
      <tspan x="35" dy="14">     |  | <tspan class="glow-purple">[V2]</tspan> | [Title.png ] | [Overlay.mp4  ]        |  |</tspan>
      <tspan x="35" dy="14">     |  | <tspan class="glow-cyan">[V1]</tspan> | [Intro.mp4       ] | [A-Roll_02.mp4]    |  |</tspan>
      <tspan x="35" dy="14">     |  | <tspan class="glow-purple">[A1]</tspan> | [Vocal_Clean.wav  ] | [BGM_LoFi.mp3]     |  |</tspan>
      <tspan x="35" dy="14">     |  '---------------------------------------------'  |</tspan>
      <tspan x="35" dy="14">     |   Rendering...  [████████████████████░░░░] 82%    |</tspan>
      <tspan x="35" dy="14">     |   Effects: Color Grading, Sound FX, Motion    |</tspan>
      <tspan x="35" dy="14">      \_______________________________________________/</tspan>
      <tspan x="35" dy="14">              ||                               ||</tspan>
      <tspan x="35" dy="14">        ===============================================</tspan>
    </text>
  </g>

  <!-- Frame 3: Graphic Design (Art Palette/Visuals) -->
  <g>
    <animate attributeName="visibility" values="hidden;hidden;visible;hidden" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.66;1" />
    <text x="35" y="45" class="ascii-text">
      <tspan x="35" dy="0">  // GRAPHIC DESIGN &amp; BRANDING  //  [Frame 3/3]</tspan>
      <tspan x="35" dy="18">  🎨   _________________________________________________</tspan>
      <tspan x="35" dy="14">      /                                                 \</tspan>
      <tspan x="35" dy="14">     |  🎨  CREATING VISUAL IDENTITY                    |</tspan>
      <tspan x="35" dy="14">     |                                                 |</tspan>
      <tspan x="35" dy="14">     |      /\        (o)  (o)   <tspan class="glow-purple">[VECTOR LOGO]</tspan>        |</tspan>
      <tspan x="35" dy="14">     |     /  \       (o)  (o)                          |</tspan>
      <tspan x="35" dy="14">     |    /____\       \____/    Typography: Outfit     |</tspan>
      <tspan x="35" dy="14">     |                                                 |</tspan>
      <tspan x="35" dy="14">     |   Colors:  [Indigo #6366f1]  [Emerald #10b981]   |</tspan>
      <tspan x="35" dy="14">     |   Output:  Logos, Vizitky, Social Assets         |</tspan>
      <tspan x="35" dy="14">      \_________________________________________________/</tspan>
      <tspan x="35" dy="14">              ||                               ||</tspan>
      <tspan x="35" dy="14">        ===============================================</tspan>
    </text>
  </g>
</svg>
