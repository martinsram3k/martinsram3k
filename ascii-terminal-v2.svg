<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="100%" height="380">
  <defs>
    <!-- Terminal background gradient -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#0d0e1a"/>
    </linearGradient>
    <!-- Title bar gradient -->
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2b3d"/>
      <stop offset="100%" stop-color="#1e1f31"/>
    </linearGradient>
    <!-- Subtle glow for text -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .t { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 500; }
    .prompt { fill: #7dd3fc; }
    .cmd { fill: #e2e8f0; }
    .out { fill: #86efac; }
    .dim { fill: #64748b; font-size: 11px; }
    .accent { fill: #c084fc; }
    .cyan { fill: #22d3ee; }
    .yellow { fill: #fbbf24; }
    .white { fill: #f1f5f9; }
    .box { fill: #818cf8; font-size: 12px; }
    .title-text { fill: #94a3b8; font-size: 11px; font-family: 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Terminal Window -->
  <rect width="620" height="380" rx="12" fill="url(#termBg)" stroke="#334155" stroke-width="1"/>
  
  <!-- Title Bar -->
  <rect width="620" height="38" rx="12" fill="url(#titleBar)"/>
  <rect y="28" width="620" height="10" fill="url(#titleBar)"/>
  
  <!-- Traffic lights -->
  <circle cx="22" cy="19" r="6.5" fill="#ff5f57" opacity="0.9"/>
  <circle cx="42" cy="19" r="6.5" fill="#febc2e" opacity="0.9"/>
  <circle cx="62" cy="19" r="6.5" fill="#28c840" opacity="0.9"/>
  
  <!-- Title -->
  <text x="310" y="23" class="title-text" text-anchor="middle">martin@macbook — zsh — 80×24</text>
  
  <!-- Subtle separator line -->
  <line x1="0" y1="38" x2="620" y2="38" stroke="#334155" stroke-width="0.5"/>

  <!-- ==================== FRAME 1: whoami (0s - 4s) ==================== -->
  <g>
    <animate attributeName="visibility" values="visible;hidden;hidden" keyTimes="0;0.267;1" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
    
    <!-- Line 1: $ whoami -->
    <text x="20" y="68" class="t prompt">❯ <tspan class="cmd">whoami</tspan></text>
    
    <!-- Line 2: Output (appears at 0.5s) -->
    <text x="20" y="92" class="t out" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.033" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      Martin Šrámek
    </text>
    
    <!-- Line 3: Description (appears at 1s) -->
    <text x="20" y="116" class="t dim" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.067" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      Freelance Creative Developer · Czech Republic 🇨🇿
    </text>
    
    <!-- Line 5: $ cat services.json (appears at 1.5s) -->
    <text x="20" y="154" class="t prompt" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.100" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      ❯ <tspan class="cmd">cat services.json</tspan>
    </text>

    <!-- JSON output (appears at 2s) -->
    <g visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.133" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <text x="20" y="178" class="t dim">{</text>
      <text x="20" y="198" class="t">  <tspan class="accent">"video"</tspan><tspan class="dim">:</tspan>    <tspan class="out">"Premiere Pro, After Effects"</tspan><tspan class="dim">,</tspan></text>
      <text x="20" y="218" class="t">  <tspan class="accent">"design"</tspan><tspan class="dim">:</tspan>   <tspan class="out">"Photoshop, Illustrator, InDesign"</tspan><tspan class="dim">,</tspan></text>
      <text x="20" y="238" class="t">  <tspan class="accent">"web"</tspan><tspan class="dim">:</tspan>      <tspan class="out">"HTML, CSS, JS, PHP, Laravel"</tspan><tspan class="dim">,</tspan></text>
      <text x="20" y="258" class="t">  <tspan class="accent">"hardware"</tspan><tspan class="dim">:</tspan> <tspan class="out">"Arduino, ESP32, Custom PCBs"</tspan></text>
      <text x="20" y="278" class="t dim">}</text>
    </g>

    <!-- Status line (appears at 3s) -->
    <text x="20" y="312" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.200" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="prompt">❯</tspan> <tspan class="yellow">█</tspan>
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ==================== FRAME 2: neofetch style (4s - 9s) ==================== -->
  <g visibility="hidden">
    <animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;0.267;0.600" dur="15s" repeatCount="indefinite" calcMode="discrete"/>

    <!-- Line 1: $ neofetch -->
    <text x="20" y="68" class="t prompt">❯ <tspan class="cmd">neofetch --creative</tspan></text>

    <!-- ASCII art block (appears at 4.5s) -->
    <g visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.300" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      
      <!-- Left side: ASCII art -->
      <text x="20" y="100" class="t cyan" font-size="11" filter="url(#glow)">
        <tspan x="20" dy="0">    ███╗   ███╗███████╗</tspan>
        <tspan x="20" dy="16">    ████╗ ████║██╔════╝</tspan>
        <tspan x="20" dy="16">    ██╔████╔██║███████╗</tspan>
        <tspan x="20" dy="16">    ██║╚██╔╝██║╚════██║</tspan>
        <tspan x="20" dy="16">    ██║ ╚═╝ ██║███████║</tspan>
        <tspan x="20" dy="16">    ╚═╝     ╚═╝╚══════╝</tspan>
      </text>

      <!-- Right side: Info -->
      <text x="300" y="100" class="t">
        <tspan x="300" dy="0"><tspan class="cyan">martin</tspan><tspan class="dim">@</tspan><tspan class="cyan">macbook</tspan></tspan>
        <tspan x="300" dy="16" class="dim">─────────────────</tspan>
        <tspan x="300" dy="16"><tspan class="accent">OS</tspan><tspan class="dim">:</tspan>      <tspan class="white">macOS Sequoia</tspan></tspan>
        <tspan x="300" dy="16"><tspan class="accent">Shell</tspan><tspan class="dim">:</tspan>   <tspan class="white">zsh 5.9</tspan></tspan>
        <tspan x="300" dy="16"><tspan class="accent">Editor</tspan><tspan class="dim">:</tspan>  <tspan class="white">VS Code</tspan></tspan>
        <tspan x="300" dy="16"><tspan class="accent">Status</tspan><tspan class="dim">:</tspan>  <tspan class="out">Available for hire ✓</tspan></tspan>
      </text>
    </g>

    <!-- Progress bars (appears at 5.5s) -->
    <g visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.367" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      
      <text x="300" y="210" class="t">
        <tspan x="300" dy="0"><tspan class="accent">Video</tspan><tspan class="dim">:</tspan>    <tspan class="out">████████████████</tspan><tspan class="dim">████</tspan> <tspan class="white">80%</tspan></tspan>
        <tspan x="300" dy="16"><tspan class="accent">Design</tspan><tspan class="dim">:</tspan>   <tspan class="out">██████████████████</tspan><tspan class="dim">██</tspan> <tspan class="white">90%</tspan></tspan>
        <tspan x="300" dy="16"><tspan class="accent">Web</tspan><tspan class="dim">:</tspan>      <tspan class="out">██████████████</tspan><tspan class="dim">██████</tspan> <tspan class="white">70%</tspan></tspan>
        <tspan x="300" dy="16"><tspan class="accent">Hardware</tspan><tspan class="dim">:</tspan> <tspan class="out">████████████</tspan><tspan class="dim">████████</tspan> <tspan class="white">60%</tspan></tspan>
      </text>

      <!-- Color palette dots -->
      <text x="300" y="290" class="t" font-size="16">
        <tspan fill="#ef4444">●</tspan> <tspan fill="#f97316">●</tspan> <tspan fill="#eab308">●</tspan> <tspan fill="#22c55e">●</tspan> <tspan fill="#3b82f6">●</tspan> <tspan fill="#8b5cf6">●</tspan> <tspan fill="#ec4899">●</tspan> <tspan fill="#64748b">●</tspan>
      </text>
    </g>

    <!-- Blinking cursor -->
    <text x="20" y="330" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.300" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="prompt">❯</tspan> <tspan class="yellow">█</tspan>
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ==================== FRAME 3: project showcase (9s - 15s) ==================== -->
  <g visibility="hidden">
    <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.600" dur="15s" repeatCount="indefinite" calcMode="discrete"/>

    <text x="20" y="68" class="t prompt">❯ <tspan class="cmd">ls ~/projects --featured</tspan></text>

    <!-- Table output (appears at 9.5s) -->
    <g visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.633" dur="15s" repeatCount="indefinite" calcMode="discrete"/>

      <text x="20" y="96" class="t dim">┌──────────────────────┬────────────────────────────────┐</text>
      <text x="20" y="116" class="t"><tspan class="dim">│</tspan> <tspan class="cyan">PROJECT</tspan>              <tspan class="dim">│</tspan> <tspan class="cyan">DESCRIPTION</tspan>                    <tspan class="dim">│</tspan></text>
      <text x="20" y="136" class="t dim">├──────────────────────┼────────────────────────────────┤</text>
    </g>

    <!-- Row 1 (appears at 10s) -->
    <text x="20" y="156" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.667" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="dim">│</tspan> <tspan class="out">🎬 klipni.eu</tspan>         <tspan class="dim">│</tspan> <tspan class="white">Video editing SaaS platform</tspan>    <tspan class="dim">│</tspan>
    </text>

    <!-- Row 2 (appears at 10.5s) -->
    <text x="20" y="176" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.700" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="dim">│</tspan> <tspan class="out">🔌 FLOW</tspan>              <tspan class="dim">│</tspan> <tspan class="white">Custom macro keyboard</tspan>          <tspan class="dim">│</tspan>
    </text>

    <!-- Row 3 (appears at 11s) -->
    <text x="20" y="196" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.733" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="dim">│</tspan> <tspan class="out">⌨️  Macropad</tspan>          <tspan class="dim">│</tspan> <tspan class="white">Web configurator for macropads</tspan> <tspan class="dim">│</tspan>
    </text>

    <!-- Row 4 (appears at 11.5s) -->
    <text x="20" y="216" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.767" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="dim">│</tspan> <tspan class="out">🍎 LidMonitor</tspan>        <tspan class="dim">│</tspan> <tspan class="white">MacBook lid state automation</tspan>   <tspan class="dim">│</tspan>
    </text>

    <!-- Row 5 (appears at 12s) -->
    <text x="20" y="236" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.800" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="dim">│</tspan> <tspan class="out">🪞 Smart Mirror</tspan>      <tspan class="dim">│</tspan> <tspan class="white">Raspberry Pi smart mirror</tspan>      <tspan class="dim">│</tspan>
    </text>

    <!-- Table bottom -->
    <text x="20" y="256" class="t dim" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.800" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      └──────────────────────┴────────────────────────────────┘
    </text>

    <!-- Summary line -->
    <text x="20" y="290" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.833" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="dim">→</tspan> <tspan class="white">5 projects</tspan> <tspan class="dim">·</tspan> <tspan class="out">open to collaborate</tspan> <tspan class="dim">·</tspan> <tspan class="accent">DM me anytime</tspan>
    </text>

    <!-- Blinking cursor -->
    <text x="20" y="330" class="t" visibility="hidden">
      <animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.867" dur="15s" repeatCount="indefinite" calcMode="discrete"/>
      <tspan class="prompt">❯</tspan> <tspan class="yellow">█</tspan>
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
