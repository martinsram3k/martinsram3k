<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="350">
  <style>
    .term-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      font-size: 13px;
      fill: #f3f4f6;
      font-weight: bold;
    }
    .prompt { fill: #38bdf8; }
    .cmd { fill: #f3f4f6; }
    .output { fill: #a7f3d0; }
    .ascii { fill: #818cf8; font-size: 11px; line-height: 14px; font-weight: bold; }
  </style>

  <rect width="100%" height="100%" fill="#0b0f19" rx="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  
  <!-- Title Bar -->
  <path d="M 0,16 A 16,16 0 0,1 16,0 L 584,0 A 16,16 0 0,1 600,16 L 600,35 L 0,35 Z" fill="#111827"/>
  <circle cx="25" cy="18" r="6" fill="#ef4444"/>
  <circle cx="45" cy="18" r="6" fill="#fbbf24"/>
  <circle cx="65" cy="18" r="6" fill="#10b981"/>
  <text x="300" y="22" fill="#9ca3af" font-size="11" font-family="monospace" text-anchor="middle">martin@macbook: ~</text>

  <!-- Main Terminal Group that clears at 11s -->
  <g>
    <animate attributeName="visibility" values="visible;hidden" keyTimes="0;0.916" dur="12s" repeatCount="indefinite" calcMode="discrete"/>

    <!-- 1. Whoami Command & Output -->
    <g>
      <text x="25" y="70" class="term-text prompt">$ <tspan class="cmd">whoami</tspan></text>
      
      <!-- Blinking Cursor -->
      <text y="70" class="term-text prompt" font-weight="bold">_
        <animate attributeName="x" values="40;40;90;90" keyTimes="0;0.016;0.100;1" dur="12s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="visibility" values="visible;hidden" keyTimes="0;0.150;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
      </text>

      <!-- Cover Rectangle for typing effect -->
      <rect x="40" y="55" width="60" height="20" fill="#0b0f19">
        <animate attributeName="x" values="40;40;90;90" keyTimes="0;0.016;0.100;1" dur="12s" repeatCount="indefinite" />
        <animate attributeName="width" values="60;60;0;0" keyTimes="0;0.016;0.100;1" dur="12s" repeatCount="indefinite" />
      </rect>

      <!-- Output -->
      <text x="25" y="95" class="term-text output" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.149;0.150;1" dur="12s" repeatCount="indefinite" />
        Martin Šrámek — Freelance Creator &amp; WebDev
      </text>
    </g>

    <!-- 2. Cat skills.txt Command & Output -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.199;0.200;1" dur="12s" repeatCount="indefinite" />
      
      <text x="25" y="130" class="term-text prompt">$ <tspan class="cmd">cat skills.txt</tspan></text>
      
      <!-- Blinking Cursor -->
      <text y="130" class="term-text prompt" font-weight="bold">_
        <animate attributeName="x" values="40;40;155;155" keyTimes="0;0.200;0.433;1" dur="12s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="visibility" values="visible;hidden" keyTimes="0;0.483;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
      </text>

      <!-- Cover Rectangle -->
      <rect x="40" y="115" width="125" height="20" fill="#0b0f19">
        <animate attributeName="x" values="40;40;155;155" keyTimes="0;0.200;0.433;1" dur="12s" repeatCount="indefinite" />
        <animate attributeName="width" values="125;125;0;0" keyTimes="0;0.200;0.433;1" dur="12s" repeatCount="indefinite" />
      </rect>

      <!-- ASCII Box Output -->
      <text x="25" y="160" class="term-text ascii" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.482;0.483;1" dur="12s" repeatCount="indefinite" />
        <tspan x="25" dy="0">  +---------------------------------------------------+</tspan>
        <tspan x="25" dy="16">  |  🎥  <tspan fill="#ffffff">Video Editing</tspan>  - Premiere Pro, After Effects  |</tspan>
        <tspan x="25" dy="16">  |  🎨  <tspan fill="#ffffff">Graphic Design</tspan> - Photoshop, Illustrator   |</tspan>
        <tspan x="25" dy="16">  |  🌐  <tspan fill="#ffffff">Web Development</tspan>- HTML/JS, Python, PHP     |</tspan>
        <tspan x="25" dy="16">  |  💼  <tspan fill="#ffffff">SaaS Projects</tspan>  - klipni.eu                  |</tspan>
        <tspan x="25" dy="16">  +---------------------------------------------------+</tspan>
      </text>
    </g>

    <!-- 3. Clear Command -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.749;0.750;1" dur="12s" repeatCount="indefinite" />
      
      <text x="25" y="290" class="term-text prompt">$ <tspan class="cmd">clear</tspan></text>
      
      <!-- Blinking Cursor -->
      <text y="290" class="term-text prompt" font-weight="bold">_
        <animate attributeName="x" values="40;40;80;80" keyTimes="0;0.750;0.833;1" dur="12s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="visibility" values="visible;hidden" keyTimes="0;0.916;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
      </text>

      <!-- Cover Rectangle -->
      <rect x="40" y="275" width="50" height="20" fill="#0b0f19">
        <animate attributeName="x" values="40;40;80;80" keyTimes="0;0.750;0.833;1" dur="12s" repeatCount="indefinite" />
        <animate attributeName="width" values="50;50;0;0" keyTimes="0;0.750;0.833;1" dur="12s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Blank command line at the very end during clear (from 11s to 12s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.915;0.916;1" dur="12s" repeatCount="indefinite"/>
    <text x="25" y="70" class="term-text prompt">$ <tspan font-weight="bold" fill="#38bdf8">_
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
    </tspan></text>
  </g>
</svg>
